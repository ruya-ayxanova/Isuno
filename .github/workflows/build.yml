name: APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Bagimliliklar
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool libtool-bin libltdl-dev pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          pip install buildozer cython==0.29.36
      - name: Derle
        run: buildozer -v android debug 2>&1 | tee build.log
      - name: Hata ozeti
        if: failure()
        run: |
          echo "===== HATA SATIRLARI ====="
          grep -v "^#" build.log | grep -n -iE "error|failed|fatal|not found" | tail -25
          echo "===== SON 40 SATIR ====="
          grep -v "^#" build.log | tail -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: |
            bin/*.apk
            build.log
